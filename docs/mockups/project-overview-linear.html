<title>Agency Flow Project</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Linear light shell — grey canvas + sidebar, one inset off-white panel. Light theme only (owner's reference). */
:root{
  color-scheme:light;
  --canvas:#f4f4f5; --panel:#fcfcfc; --raised:#ffffff; --fg:#26282e; --fg2:#62656d; --fg3:#94979f; --fg4:#c2c4ca;
  --line:#ececee; --line2:#e3e3e6; --hover:#f1f1f2; --active:#e9e9eb; --band:#f3f3f4; --sel:#eef1fd; --focus:#f0f0f2;
  --accent:#3b7bf2; --indigo:#5e6ad2; --danger:#eb5757; --amber:#e3a008;
  --shadow:0 0 0 1px rgba(20,20,30,.07),0 10px 28px -8px rgba(20,20,30,.18),0 2px 6px -2px rgba(20,20,30,.07);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--fg);font:13px/1.4 var(--font);font-feature-settings:"cv11";-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
svg{flex:none;display:block}
.muted{color:var(--fg3)}
.grow{flex:1}
.app{display:flex;height:100%;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

/* sidebar */
.sb{width:236px;flex:none;display:flex;flex-direction:column;padding:10px 10px;gap:1px;overflow:auto}
.ws{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 8px;border-radius:6px;font-weight:500;margin-bottom:8px}
.ws .logo{width:20px;height:20px;border-radius:5px;background:#26282e;color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center}
.ws .rb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);background:var(--raised);box-shadow:0 0 0 1px var(--line2)}
.ib{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--fg2)}
.ib:hover{background:var(--hover);color:var(--fg)}
.nav{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:6px;color:var(--fg);font-weight:450;width:100%;text-align:left}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--active)}
.nav svg{color:var(--fg2)}
.sbh{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--fg3);padding:16px 8px 4px;font-weight:450}
.badge{display:inline-flex;align-items:center;justify-content:center;height:18px;min-width:18px;padding:0 6px;border-radius:9px;font-size:11px;font-weight:700;background:#fde2e2;color:#b42318;font-variant-numeric:tabular-nums}
.sbtimer{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--raised);box-shadow:0 0 0 1px var(--line2);font-size:12px}
.sbtimer .t{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* panel */
.panel{flex:1;min-width:0;margin:8px 8px 8px 0;background:var(--panel);border-radius:10px;box-shadow:0 0 0 1px var(--line2);display:flex;flex-direction:column;overflow:hidden;position:relative}
.top{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 18px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:7px;font-weight:500;min-width:0;white-space:nowrap}
.crumb .sep{color:var(--fg4)}
.crumb .dim{color:var(--fg2);font-weight:450}
.bar{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 12px;overflow-x:auto;scrollbar-width:none}
.tab{height:28px;padding:0 11px;border-radius:14px;color:var(--fg2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:450;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2)}
.tab:hover{color:var(--fg);background:var(--hover)}
.tab.on{background:var(--active);box-shadow:none;color:var(--fg);font-weight:500}
.tab .n{color:var(--fg3);font-variant-numeric:tabular-nums;font-weight:450}
.tab .scope{color:var(--fg3)}
.rb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);position:relative}
.rb:hover{background:var(--hover);color:var(--fg)}
.rb .mod{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--indigo);box-shadow:0 0 0 2px var(--panel)}
.gb{height:28px;padding:0 9px;border-radius:6px;color:var(--fg2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.gb:hover{background:var(--hover);color:var(--fg)}
.chips{display:flex;align-items:center;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
.fchip{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 4px 0 9px;border-radius:13px;background:var(--hover);color:var(--fg)}
.fchip b{font-weight:500}
.fchip .k{color:var(--fg3)}
.fchip .x{width:20px;height:20px;display:grid;place-items:center;border-radius:10px;color:var(--fg3)}
.fchip .x:hover{background:var(--active);color:var(--fg)}
.body{flex:1;overflow:auto;position:relative;padding:0 8px 80px}

/* groups + rows — Linear: grey band headers, borderless rounded rows */
.gh{position:sticky;top:0;z-index:2;height:38px;display:flex;align-items:center;gap:9px;padding:0 10px 0 8px;background:var(--band);border-radius:6px;font-weight:500;margin-top:4px}
.gh .chev{width:18px;height:18px;display:grid;place-items:center;color:var(--fg3);border-radius:4px}
.gh .chev:hover{background:var(--active)}
.gh .c{color:var(--fg3);font-weight:450;font-variant-numeric:tabular-nums}
.gh .sub{color:var(--fg3);font-weight:400;font-size:12px}
.row{position:relative;height:42px;display:flex;align-items:center;gap:10px;padding:0 12px 0 40px;border-radius:6px;cursor:default;margin:1px 0}
.row:hover{background:var(--hover)}
.row.focus{background:var(--focus)}
.row.sel{background:var(--sel)}
.row.openrow{background:var(--sel)}
.row .slot{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;display:grid;place-items:center;opacity:0;color:var(--fg3)}
.row:hover .slot,.row.sel .slot,.hasSel .row .slot{opacity:1}
.cb{width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1.3px var(--fg4);display:grid;place-items:center;background:var(--raised)}
.row.sel .cb{background:var(--indigo);box-shadow:none}
.pbtn{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--fg2)}
.pbtn:hover{background:var(--active)}
.tid{color:var(--fg3);font-variant-numeric:tabular-nums;width:60px;flex:none}
.tline{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.ttl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:var(--fg)}
.ttl .par{color:var(--fg3);font-weight:450;margin-right:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.ring{color:var(--fg3);display:inline-flex;align-items:center;gap:4px;font-size:12px;font-variant-numeric:tabular-nums}
.addtd{height:22px;padding:0 7px;border-radius:5px;display:inline-flex;align-items:center;gap:5px;color:var(--fg3);font-size:12px;opacity:0;white-space:nowrap}
.row:hover .addtd{opacity:1}
.addtd:hover{background:var(--active);color:var(--fg)}
.addtd.on{opacity:1;color:#d99a06;padding:0 4px}
.lastact{color:var(--fg3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.meta{display:flex;align-items:center;gap:10px;flex:none}
.cm{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 6px;border-radius:11px;color:var(--fg3);font-size:12px;font-variant-numeric:tabular-nums}
.cm.new{background:#fde4e4;color:#c4302b;font-weight:600}
.lab{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:11px;color:var(--fg2);font-size:12px;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line2);background:var(--raised)}
.lab i{width:7px;height:7px;border-radius:50%;flex:none}
.cat{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:11px;color:var(--fg2);font-size:12px;white-space:nowrap}
.cat i{width:7px;height:7px;border-radius:50%;flex:none}
.proj{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);font-size:12px;white-space:nowrap;max-width:150px;overflow:hidden}
.due{display:inline-flex;align-items:center;gap:5px;color:var(--fg2);font-size:12px;width:58px;justify-content:flex-end;font-variant-numeric:tabular-nums;white-space:nowrap}
.due.over{color:var(--danger)}
.due.none{visibility:hidden}
.est{color:var(--fg3);font-size:12px;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.tm{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);font:12px var(--mono);width:74px;justify-content:flex-end;font-variant-numeric:tabular-nums;border-radius:5px;height:24px;padding:0 4px}
.tm .play{color:var(--fg);opacity:.4}
.tm:hover{background:var(--active)}
.tm:hover .play{opacity:.75}
.tm .zero{opacity:0}
.row:hover .tm .zero{opacity:1;color:var(--fg3);font-family:var(--font)}
.tm.run{color:var(--danger);font-weight:500}
.tm.done{opacity:.35}
.crt{color:var(--fg3);font-size:12px;width:44px;text-align:right;font-variant-numeric:tabular-nums}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:600;color:#fff;flex:none;letter-spacing:.02em}
.av.none{background:none;color:var(--fg3)}
.from{color:var(--fg3);font-size:12px;white-space:nowrap}
.rowact{display:none;gap:2px}
.row:hover .rowact{display:flex}
.mini{height:24px;padding:0 8px;border-radius:5px;color:var(--fg2);font-size:12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.mini:hover{background:var(--active);color:var(--fg)}
.addrow{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px 0 40px;color:var(--fg3);width:100%;text-align:left;border-radius:6px}
.addrow:hover{background:var(--hover);color:var(--fg)}
.empty{padding:56px 24px;text-align:center;color:var(--fg3)}

/* aligned table grid — every attribute sits in its own column, one vertical line per property */
.tbl{width:100%}
.tbl .row,.thead{display:grid;grid-template-columns:var(--cols);column-gap:12px;align-items:center;padding:0 12px 0 40px;border-radius:0;margin:0}
.tbl .row{height:40px;border-bottom:1px solid var(--line)}
.thead{position:sticky;top:0;z-index:3;height:36px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--fg3);font-size:12px}
.th{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;min-width:0}
.th.sort{cursor:pointer}.th.sort:hover,.th.on{color:var(--fg)}
.tbl .gh{top:36px;border-radius:0;margin:0;padding-left:12px;border-bottom:1px solid var(--line)}
.tbl .gh+.gh,.tbl .row+.gh{margin-top:0}
.cell{min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
.tbl .ttl{flex:0 1 auto}
.cell .txt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cell.ec .add{opacity:0;color:var(--fg3);font-size:12px;display:inline-flex;gap:4px;align-items:center}
.row:hover .cell.ec .add{opacity:1}
.stcell{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 6px;margin-left:-6px;border-radius:6px;min-width:0;max-width:100%}
.stcell:hover{background:var(--active)}
.tbl .tid{width:auto;white-space:nowrap}
.tbl .tm{width:auto;justify-content:flex-start;margin-left:-4px}
.tbl .due{width:auto;justify-content:flex-start}
.tbl .proj{max-width:none}
.tbl .addrow{border-bottom:1px solid var(--line);border-radius:0}
.subl.tbl{min-width:0}
.subl.tbl .row{padding-left:8px;height:36px}

/* project overview — month header + billing banner + KPIs, month's work below; project data in a separate side panel */
.det{display:flex;flex:1;min-height:0}
.pmain{flex:1;min-width:0;overflow:auto;padding:0 12px 60px}
.mhead{padding:24px 12px 0}
.mrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mt{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.ms{color:var(--fg3);margin-top:4px;font-variant-numeric:tabular-nums}
.rail{display:flex;align-items:center;gap:2px;padding:2px;border-radius:8px;background:var(--band)}
.rail .m{height:26px;padding:0 10px;border-radius:6px;color:var(--fg2);display:inline-flex;align-items:center;gap:6px;font-weight:450;white-space:nowrap}
.rail .m:hover{color:var(--fg)}
.rail .m.on{background:var(--raised);color:var(--fg);font-weight:500;box-shadow:0 0 0 1px var(--line2),0 1px 2px rgba(0,0,0,.04)}
.rail .m i{width:6px;height:6px;border-radius:50%;flex:none}
.rail .ib{width:26px;height:26px}
.banner{display:flex;align-items:center;gap:12px;margin-top:20px;padding:12px 12px 12px 14px;border-radius:10px;border:1px solid}
.banner .bi{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none}
.banner .bt{font-weight:600}
.banner .bd{color:var(--fg2);margin-top:1px;font-variant-numeric:tabular-nums}
.banner.blue{background:#f3f7ff;border-color:#d9e5ff}.banner.blue .bi{background:#e1ebff;color:#2459d6}
.banner.green{background:#f4fbf6;border-color:#d5eedd}.banner.green .bi{background:#dff3e6;color:#24854c}
.fin{display:grid;grid-template-columns:1.15fr .85fr 1.15fr;margin-top:16px;border-radius:10px;background:var(--raised);box-shadow:0 0 0 1px var(--line2)}
.fcol{padding:16px 20px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.fcol+.fcol{border-left:1px solid var(--line)}
.fh{font-weight:600}
.mg1{display:flex;flex-direction:column;gap:12px}
.mg2{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.mr{display:flex;flex-direction:column;gap:1px;min-width:0}
.mr .l{color:var(--fg3);font-size:12px}
.mr .v{font-size:18px;font-weight:600;letter-spacing:-.015em;font-variant-numeric:tabular-nums;white-space:nowrap}
.mr .v.neg{color:var(--danger)}
.arc{display:flex;flex-direction:column;align-items:center;flex:none}
.av2{margin-top:-26px;display:flex;flex-direction:column;align-items:center;gap:2px}
.av2 b{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.av2 span{color:var(--fg3);font-size:12px;font-variant-numeric:tabular-nums}
.nav2{display:inline-flex;gap:2px;margin-right:6px}
.nav2 .ib{width:28px;height:28px;box-shadow:inset 0 0 0 1px var(--line2);background:var(--raised)}
.lnk{height:26px;padding:0 8px;border-radius:6px;font-weight:500;color:var(--fg2);white-space:nowrap}
.lnk:hover{background:var(--hover);color:var(--fg)}
.lnk.pri{color:#2459d6}
.bn-stripe{display:flex;align-items:center;gap:9px;margin-top:18px;height:44px;padding:0 6px 0 14px;border-radius:8px;background:var(--raised);box-shadow:0 0 0 1px var(--line2)}
.bn-stripe .t{font-weight:600;white-space:nowrap}.bn-stripe .d{color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bn-stripe.blue>svg{color:#2459d6}.bn-stripe.green>svg{color:#24854c}
.bn-linear{display:flex;align-items:center;gap:10px;margin-top:12px;min-height:28px}
.bn-linear .chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.bn-linear .chip i{width:7px;height:7px;border-radius:50%}
.bn-linear.blue .chip{background:#eaf1ff;color:#2459d6}.bn-linear.blue .chip i{background:#3b7bf2}
.bn-linear.green .chip{background:#e7f6ec;color:#24854c}.bn-linear.green .chip i{background:#4cb782}
.bn-linear .d{color:var(--fg2)}
.bn-ramp{display:flex;align-items:center;gap:10px;margin-top:18px;padding:14px 14px 14px 18px;border-radius:10px;background:var(--band)}
.bn-ramp .amt{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bn-ramp .d{color:var(--fg2);margin-top:1px}
.bn-ramp.green .amt{color:var(--fg3)}
.trend{padding:6px 8px 4px}
.bars{position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:0 6px}
.bars .incl{position:absolute;left:0;right:0;border-top:1px dashed #c9ccd2}
.bar1{width:22px;height:100%;display:flex;align-items:flex-end;justify-content:center}
.bar1 span{display:block;width:6px;border-radius:3px;background:#d4d6db}
.bar1.over span{background:#efa3a3}
.bar1.on span{background:var(--fg)}.bar1.on.over span{background:var(--danger)}
.bar1:hover span{background:var(--fg3)}
.blab{display:flex;justify-content:space-between;padding:0 6px;margin-top:6px}.blab span{width:22px;text-align:center;font-size:11px;color:var(--fg3)}.blab span.on{color:var(--fg);font-weight:500}
.t3{width:200px}
.t3b{position:relative;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--line2)}
.t3b .incl{position:absolute;left:0;right:0;border-top:1px dashed #c9ccd2}
.t3c{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}
.t3c span{display:block;width:14px;border-radius:3px 3px 0 0;background:#dcdee2}
.t3c.over span{background:#f0b4b4}
.t3c.on span{background:var(--fg)}.t3c.on.over span{background:var(--danger)}
.t3c:hover span{opacity:.75}
.t3l{display:flex;gap:10px;margin-top:6px}
.t3l button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--fg3)}
.t3l b{font:11px var(--mono);font-weight:400;color:var(--fg3)}
.t3l b.neg{color:var(--danger)}
.t3l button.on span{color:var(--fg);font-weight:500}.t3l button.on b{color:var(--fg)}.t3l button.on b.neg{color:var(--danger)}
.lnk.inl{height:auto;padding:0;font-weight:500;color:#2459d6}
.lnk.inl:hover{background:none;text-decoration:underline}
.tdot{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#3b7bf2;color:#fff;font-size:10.5px;font-weight:600;margin-left:2px}
.bsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:20px;border-radius:10px;background:var(--raised);box-shadow:0 0 0 1px var(--line2)}
.bsum>div{padding:14px 18px;display:flex;flex-direction:column;gap:2px}
.bsum>div+div{border-left:1px solid var(--line)}
.bsum .l{color:var(--fg3);font-size:12px}
.bsum .v{font-size:18px;font-weight:600;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.bsum .v.dim{color:var(--fg3)}
.blist{margin:28px -12px 0}
.blist .row,.blist .thead{display:grid;grid-template-columns:var(--cols);column-gap:12px;align-items:center;padding:0 12px 0 24px}
.blist .thead{height:34px;border-bottom:1px solid var(--line);color:var(--fg3);font-size:12px}
.blist .row{height:44px;border-bottom:1px solid var(--line);border-radius:0;margin:0;cursor:pointer}
.blist .neg{color:var(--danger)}
.btn.sm2{height:26px;padding:0 9px;font-size:12px}
.chip.amber{background:#fdf3dc;color:#9a6a00}.chip.amber i{background:#e3a008}
.brow .rmore{opacity:0}.brow:hover .rmore{opacity:1}
.pop{position:fixed;z-index:50;min-width:200px;padding:4px;border-radius:9px;background:var(--raised);box-shadow:var(--shadow)}
.pop .mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border-radius:6px;text-align:left;color:var(--fg)}
.pop .mi svg{color:var(--fg2)}.pop .mi:hover{background:var(--hover)}
.pop .mi .k{margin-left:auto;font-size:11px;color:var(--fg3)}
.pop .sep{height:1px;background:var(--line);margin:4px 2px}
.chip.red{background:#fde8e8;color:#c4302b}.chip.red i{background:#eb5757}
.btn[disabled]{opacity:.45;cursor:not-allowed}

        <div style="display:flex;align-items:center;gap:28px">${arc(used,INCL)}
          <div class="mg1"><div class="mr"><span class="l">Billable hours</span><span class="v">${hm(used-nb)}</span></div>
          <div class="mr"><span class="l">Non-billable hours</span><span class="v">${hm(nb)}</span></div></div></div></div>
      <div class="fcol"><div class="fh">Overage</div>
        <div class="mg1"><div class="mr"><span class="l">Over budget</span><span class="v ${over?"neg":""}">${over?"+"+hm(over):"—"}</span></div>
        ${ROLE==="admin"?`<div class="mr"><span class="l">Overage due</span><span class="v ${over?"neg":""}">${over?usd(overAmt):"—"}</span></div>`:""}</div></div>
      ${ROLE==="admin"?`<div class="fcol"><div class="fh">Profitability</div>
        <div class="mg2"><div class="mr"><span class="l">Earned revenue</span><span class="v">${usd(rev)}</span></div>
        <div class="mr"><span class="l">Profit</span><span class="v ${profit<0?"neg":""}">${usd(profit)}</span></div>
        <div class="mr"><span class="l">Total cost</span><span class="v">${usd(cost)}</span></div>
        <div class="mr"><span class="l">Margin</span><span class="v">${margin}%</span></div></div></div>`:""}
    </div>`;

  /* the month's work — the Tasks page list, toolbar included (filter + display) */
  const cols="22px 60px 18px minmax(220px,1fr) 28px 64px";
  const groups=["prog","crev","next","done"].map(id=>ST[id]).filter(s=>m.tasks.some(t=>t[2]===s.id));
  document.getElementById("lhead").innerHTML=`Work in ${mon}<span class="c">${m.tasks.length}</span><span class="grow"></span>
     <button class="rb" title="Filter (F)">${ico("filter")}</button><button class="rb" title="Display options">${ico("display")}</button>`;
  document.getElementById("list").innerHTML=
   groups.map(s=>{const ts=m.tasks.filter(t=>t[2]===s.id);return `<div class="gh"><span class="chev">${ico("down",12,1.6)}</span>${statusIco(s.id)}<span>${s.name}</span><span class="c">${ts.length}</span><span class="tot">${hm(ts.reduce((a,t)=>a+t[6],0))}</span></div>`+
     ts.map(t=>`<div class="row" style="--cols:${cols}"><span class="cell"><span class="pbtn">${prioIco(t[3])}</span></span><span class="cell tid">${t[0]}</span><span class="cell">${statusIco(t[2])}</span><span class="cell"><span class="ttl">${t[1]}</span></span><span class="cell">${av(t[4])}</span><span class="cell mono" style="justify-content:flex-end">${t[6]?hm(t[6]):"—"}</span></div>`).join("")}).join("");

  /* side panel: project data only, in Linear-style cards */
  const kv=(k,v)=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  document.getElementById("side").innerHTML=`
   ${monthCardHTML(m,{used,over,overAmt,mon})}
   <div class="pcard"><h4>Properties</h4>
     ${kv("Status",`<i style="width:7px;height:7px;border-radius:50%;background:#4cb782"></i>Active`)}
     ${kv("Client","SEED: Monthly retainer")}
     ${kv("Lead",av("at",18)+"Ádám Tóth")}
     ${kv("Team",av("at",18)+av("bk",18)+av("rs",18))}
   </div>
   <div class="pcard"><h4>Retainer</h4>
     ${kv("Included","08:00 / month")}
     ${kv("Fee",usd(FEE)+" / month")}
     ${kv("Overage rate",usd(RATE)+" / h")}
     ${kv("Rollover","Off")}
   </div>`;
  document.getElementById("lhead").style.display=TAB==="billing"?"none":"";
  if(TAB==="billing") renderBilling();
}
function sw(){document.getElementById("bvsw").innerHTML=`<span style="opacity:.6;margin-right:6px">Banner style</span>`+[["tinted","A · Tinted"],["stripe","B · Stripe"],["linear","C · Linear"],["ramp","D · Ramp"]].map(([k,l])=>`<button data-bv="${k}" class="${BV===k?"on":""}">${l}</button>`).join("")}
function rowAction(x){
  if(x.bs==="open")return `<button class="btn pri sm2">Review & invoice</button>`;
  if(x.bs==="toclose")return x.wait?`<button class="btn sm2" disabled title="Close ${x.wait} first">Review & close</button>`:`<button class="btn sm2">Review & close</button>`;
  if(x.bs==="draft")return `<button class="btn sm2">Open draft</button>`;
  if(x.bs==="invoiced"||x.bs==="pastdue")return `<button class="btn sm2">Mark as paid</button>`;
  return "";
}
function renderBilling(){
  const rows=MONTHS.map((x,i)=>({x,i,...stat(x)})).reverse();
  const open=rows.filter(r=>r.x.bs==="open"||r.x.bs==="draft"),outst=rows.filter(r=>r.x.bs==="invoiced"||r.x.bs==="pastdue"),outAmt=outst.reduce((a,r)=>a+r.amt,0),pd=rows.filter(r=>r.x.bs==="pastdue").length,unbilled=open.reduce((a,r)=>a+r.amt,0),billed=rows.filter(r=>r.x.bs==="invoiced").reduce((a,r)=>a+r.amt,0);
  const chip=CHIP;
  const cols="minmax(120px,1fr) 128px 116px 84px 84px 132px 92px";
  document.getElementById("mhead").innerHTML=`
    <div class="mt">Billing</div>
    <div class="ms">Retainer · ${hm(INCL)} included · ${usd(FEE)} / month · overage ${usd(RATE)} / h</div>
    <div class="bsum">
      <div><span class="l">Unbilled overage</span><span class="v ${unbilled?"":"dim"}">${usd(unbilled)}</span></div>
      <div><span class="l">Outstanding</span><span class="v">${usd(outAmt)}${pd?` <span class="neg" style="font-size:12px;font-weight:500">· ${pd} past due</span>`:""}</span></div>
      <div><span class="l">Latest invoice</span><span class="v"><span class="mono" style="font-size:14px;color:var(--fg)">INV-0043</span> <span class="muted" style="font-size:13px;font-weight:450">· draft</span></span></div>
    </div>
    <div class="blist">
      <div class="thead" style="--cols:${cols}"><span class="th">Month</span><span class="th">Status</span><span class="th">Hours</span><span class="th">Overage</span><span class="th">Invoice</span><span class="th"></span><span class="th" style="justify-content:flex-end">Files</span></div>
      ${rows.map(r=>`<div class="row brow" style="--cols:${cols}" data-i="${r.i}">
        <span class="cell"><span class="ttl">${r.x.name}</span></span>
        <span class="cell"><span class="chip ${chip[r.x.bs][0]}"><i></i>${chip[r.x.bs][1]}</span></span>
        <span class="cell mono ${r.o?"neg":""}">${hm(r.u)} <span class="muted">/ ${hm(INCL)}</span></span>
        <span class="cell mono" style="${r.o?"color:var(--fg)":""}">${r.o?usd(r.amt):"—"}</span>
        <span class="cell">${r.x.inv?`<span class="inv">${r.x.inv}</span>`:`<span class="muted">—</span>`}</span>
        <span class="cell">${rowAction(r.x)}</span>
        <span class="cell" style="justify-content:flex-end;gap:0"><button class="ib sm" title="Monthly report">${ico("doc",14)}</button><button class="ib sm" title="Worksheet">${ico("board",14)}</button><button class="ib sm rmore" title="More" data-pop="row" data-bs="${r.x.bs}">${ico("more",14)}</button></span>
      </div>`).join("")}
    </div>`;
  document.getElementById("lhead").innerHTML="";document.getElementById("list").innerHTML="";
  document.querySelector("#side .mc")?.remove();
}
function pop(el,html){closePop();const r=el.getBoundingClientRect(),d=document.createElement("div");d.className="pop";d.innerHTML=html;document.body.appendChild(d);
  d.style.top=(r.bottom+4)+"px";d.style.left=Math.max(8,Math.min(innerWidth-d.offsetWidth-8,r.right-d.offsetWidth))+"px"}
function closePop(){document.querySelectorAll(".pop").forEach(x=>x.remove())}
const mi=(ic,l,k="")=>`<button class="mi">${ico(ic,14)}<span>${l}</span>${k?`<span class="k">${k}</span>`:""}</button>`;
function roleSw(){document.getElementById("rolesw").innerHTML=`<span style="opacity:.6;margin-right:6px">View as</span>`+[["admin","Admin"],["member","Member"]].map(([k,l])=>`<button data-role="${k}" class="${ROLE===k?"on":""}">${l}</button>`).join("")}
try{if(localStorage.getItem("po-side")==="0")document.getElementById("side").style.display="none"}catch(e){}
document.addEventListener("click",e=>{
  const pp=e.target.closest("[data-pop]");
  if(pp){e.stopPropagation();const k=pp.dataset.pop,bs=pp.dataset.bs;
    if(k==="proj")pop(pp,mi("board","Export worksheet…","Custom range")+`<div class="sep"></div>`+mi("archive","Archive project"));
    else{const undo={closed:mi("archive","Reopen period"),draft:mi("x","Delete draft"),invoiced:mi("archive","Revert to draft")+mi("x","Void invoice…"),pastdue:mi("archive","Revert to draft")+mi("x","Void invoice…"),paid:mi("archive","Mark as unpaid")}[bs]||"";
      pop(pp,mi("list","View entries")+mi("board","Download worksheet")+(undo?`<div class="sep"></div>`+undo:""))}
    return}
  if(!e.target.closest(".pop"))closePop();
  const rl=e.target.closest("[data-role]");if(rl){ROLE=rl.dataset.role;if(ROLE==="member")TAB="overview";roleSw();render();return}
  const sd=e.target.closest("[data-side]");if(sd){const el=document.getElementById("side"),hide=el.style.display!=="none";el.style.display=hide?"none":"";try{localStorage.setItem("po-side",hide?"0":"1")}catch(e){}return}
  const ro=e.target.closest("[data-route]");if(ro){ROUTE=ro.dataset.route;document.getElementById("projmain").style.display=ROUTE==="project"?"":"none";document.getElementById("hubmain").style.display=ROUTE==="hub"?"":"none";sidebar();ROUTE==="hub"?renderHub():render();return}
  const ht=e.target.closest("[data-hubtab]");if(ht){HUBTAB=ht.dataset.hubtab;renderHub();return}
  const fv=e.target.closest("[data-invf]");if(fv){INVF=fv.dataset.invf;renderHub();return}
  const gr=e.target.closest("[data-go]");if(gr&&!e.target.closest("button")){sel=+gr.dataset.go;TAB="overview";ROUTE="project";document.getElementById("projmain").style.display="";document.getElementById("hubmain").style.display="none";sidebar();render();return}
  const tb=e.target.closest("[data-tab]");if(tb){if(["overview","billing"].includes(tb.dataset.tab)){TAB=tb.dataset.tab;render()}return}
  if(e.target.closest(".sm2,.ib.sm"))return;
  const t=e.target.closest("[data-i]");if(t){sel=+t.dataset.i;TAB="overview";render()}});
sidebar();roleSw();render();
</script>
