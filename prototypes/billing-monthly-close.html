<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monthly Close Prototype</title>
  <style>
    :root {
      --bg: #f4f1eb;
      --surface: #fffdf8;
      --surface-2: #f8f5ef;
      --ink: #20201d;
      --muted: #716d63;
      --faint: #a59f92;
      --line: #ded7ca;
      --line-strong: #c8bead;
      --green: #26765a;
      --green-bg: #e7f1eb;
      --amber: #9a6415;
      --amber-bg: #f7ead2;
      --red: #9d3b32;
      --red-bg: #f5ded9;
      --blue: #2f5f87;
      --blue-bg: #e3edf4;
      --charcoal: #2a2925;
      --shadow: 0 20px 60px rgba(42, 38, 30, .12);
      --radius: 8px;
      --mono: "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: Georgia, "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(32, 32, 29, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(32, 32, 29, .035) 1px, transparent 1px),
        var(--bg);
      background-size: 28px 28px;
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 76px minmax(720px, 1fr) minmax(390px, 520px);
    }

    .rail {
      background: var(--charcoal);
      color: #f7f1e5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px 10px;
    }

    .mark {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-size: 23px;
      background: #36342f;
    }

    .rail-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 7px;
      color: #ebe4d8;
      background: transparent;
      display: grid;
      place-items: center;
      position: relative;
    }

    .rail-btn.active {
      background: #f3ead8;
      color: #22201d;
    }

    .rail-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .rail-spacer {
      flex: 1;
    }

    .main {
      min-width: 0;
      border-right: 1px solid var(--line);
      background: rgba(255, 253, 248, .72);
      backdrop-filter: blur(10px);
    }

    .topbar {
      min-height: 92px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 28px 18px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(28px, 3vw, 40px);
      font-weight: 500;
      letter-spacing: -.01em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .month-select,
    .search {
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      padding: 0 11px;
      outline: none;
    }

    .search {
      width: 230px;
    }

    .btn {
      min-height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 650;
      white-space: nowrap;
    }

    .btn.primary {
      border-color: #24231f;
      background: #24231f;
      color: #fffaf0;
    }

    .btn.ghost {
      background: transparent;
    }

    .btn.danger {
      border-color: rgba(157, 59, 50, .36);
      background: var(--red-bg);
      color: var(--red);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .workspace {
      padding: 22px 28px 28px;
      display: grid;
      gap: 18px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .8);
      padding: 13px 14px;
      min-height: 86px;
    }

    .metric label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 26px;
      line-height: 1;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }

    .metric span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 11px;
    }

    .segments {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-2);
    }

    .segment {
      border: 0;
      border-radius: 5px;
      min-height: 29px;
      padding: 0 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .segment.active {
      background: var(--ink);
      color: #fffaf0;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .queue {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .queue-head,
    .queue-row {
      display: grid;
      grid-template-columns: 1.45fr .82fr .74fr .78fr .72fr 108px;
      gap: 12px;
      align-items: center;
    }

    .queue-head {
      min-height: 43px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .queue-row {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      min-height: 74px;
      padding: 10px 14px;
      text-align: left;
      transition: background .14s ease, box-shadow .14s ease;
    }

    .queue-row:last-child {
      border-bottom: 0;
    }

    .queue-row:hover {
      background: #fbf7ee;
    }

    .queue-row.selected {
      background: #efe6d4;
      box-shadow: inset 4px 0 0 #25231f;
    }

    .project-cell {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: #fffdf8;
      background: #3f5f55;
      font-weight: 760;
      font-size: 13px;
      flex: 0 0 auto;
    }

    .titleline {
      min-width: 0;
    }

    .titleline strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .titleline span {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .cell-main {
      display: block;
      font-weight: 720;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .cell-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .pill.statement {
      color: var(--blue);
      background: var(--blue-bg);
      border-color: rgba(47, 95, 135, .2);
    }

    .pill.invoice {
      color: var(--amber);
      background: var(--amber-bg);
      border-color: rgba(154, 100, 21, .2);
    }

    .pill.closed,
    .pill.issued {
      color: var(--green);
      background: var(--green-bg);
      border-color: rgba(38, 118, 90, .2);
    }

    .pill.draft {
      color: #5f5646;
      background: #eee8dd;
      border-color: rgba(95, 86, 70, .22);
    }

    .pill.review {
      color: var(--red);
      background: var(--red-bg);
      border-color: rgba(157, 59, 50, .22);
    }

    .action-text {
      font-weight: 760;
      font-size: 13px;
      color: var(--ink);
      text-align: right;
      display: block;
    }

    .drawer {
      min-width: 0;
      background: #eee7db;
      display: grid;
      grid-template-rows: auto 1fr;
      max-height: 100vh;
      position: sticky;
      top: 0;
    }

    .drawer-head {
      border-bottom: 1px solid var(--line-strong);
      padding: 18px 18px 14px;
      background: #f5efe4;
    }

    .drawer-title {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .drawer-title h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .doc-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .doc-scroll {
      overflow: auto;
      padding: 18px;
    }

    .document {
      background: #fffdfa;
      border: 1px solid #d8d0c2;
      border-radius: 3px;
      box-shadow: 0 24px 80px rgba(32, 29, 23, .18);
      min-height: calc(100vh - 156px);
      padding: 30px;
    }

    .doc-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 170px;
      gap: 18px;
      align-items: start;
      border-bottom: 2px solid #2b2924;
      padding-bottom: 22px;
    }

    .doc-kicker {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 820;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .doc-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 33px;
      font-weight: 500;
    }

    .doc-meta {
      display: grid;
      gap: 7px;
      padding-top: 3px;
      font-size: 12px;
    }

    .doc-meta div {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .doc-meta span {
      color: var(--muted);
    }

    .parties {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin: 26px 0;
    }

    .party {
      border-top: 1px solid var(--line);
      padding-top: 11px;
    }

    .party label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 8px;
    }

    .party strong {
      display: block;
      margin-bottom: 4px;
    }

    .party p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .summary-band {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      margin-bottom: 24px;
    }

    .summary-item {
      padding: 12px;
      border-right: 1px solid var(--line);
    }

    .summary-item:last-child {
      border-right: 0;
    }

    .summary-item label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 820;
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .summary-item strong {
      display: block;
      margin-top: 6px;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }

    .doc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .doc-table th {
      border-bottom: 1px solid #2b2924;
      padding: 8px 0;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .1em;
      text-align: left;
    }

    .doc-table th.num,
    .doc-table td.num {
      text-align: right;
    }

    .doc-table td {
      border-bottom: 1px solid var(--line);
      padding: 11px 0;
      vertical-align: top;
    }

    .line-desc {
      font-weight: 690;
    }

    .line-note {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      margin-top: 4px;
    }

    .hidden-line {
      opacity: .35;
      text-decoration: line-through;
    }

    .doc-total {
      display: grid;
      justify-content: end;
      margin-top: 18px;
      gap: 8px;
    }

    .total-row {
      display: grid;
      grid-template-columns: 150px 120px;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .total-row strong {
      color: var(--ink);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .amount-due {
      margin-top: 4px;
      border-top: 2px solid #2b2924;
      padding-top: 10px;
      font-size: 17px;
      color: var(--ink);
    }

    .doc-note {
      margin-top: 26px;
      border: 1px solid var(--line);
      background: #faf7ef;
      padding: 13px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .editor {
      margin-top: 18px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #f7f0e4;
      overflow: hidden;
    }

    .editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line-strong);
      font-size: 12px;
      font-weight: 780;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .editor-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 86px 82px;
      gap: 8px;
      align-items: center;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
    }

    .editor-row:last-child {
      border-bottom: 0;
    }

    .editor-row input {
      min-width: 0;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fffdf8;
      padding: 0 8px;
    }

    .mini-actions {
      display: flex;
      gap: 4px;
      justify-content: flex-end;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fffdf8;
      color: var(--ink);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: #24231f;
      color: #fffaf0;
      border-radius: 7px;
      padding: 10px 14px;
      font-size: 13px;
      box-shadow: var(--shadow);
      transition: opacity .2s ease, transform .2s ease;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1180px) {
      .app {
        grid-template-columns: 64px 1fr;
      }

      .drawer {
        grid-column: 2;
        position: relative;
        max-height: none;
        border-top: 1px solid var(--line);
      }
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .rail {
        display: none;
      }

      .drawer {
        grid-column: auto;
      }

      .topbar,
      .strip {
        align-items: stretch;
        flex-direction: column;
      }

      .top-actions,
      .segments {
        justify-content: flex-start;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .queue {
        overflow-x: auto;
      }

      .queue-head,
      .queue-row {
        min-width: 760px;
      }

      .parties,
      .summary-band,
      .doc-top {
        grid-template-columns: 1fr;
      }

      .summary-item {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .summary-item:last-child {
        border-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Primary navigation">
      <div class="mark">A</div>
      <button class="rail-btn" aria-label="Projects">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h12M4 18h8"/></svg>
      </button>
      <button class="rail-btn active" aria-label="Monthly close">
        <svg viewBox="0 0 24 24"><path d="M8 3v4M16 3v4M4 9h16M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="m9 15 2 2 4-5"/></svg>
      </button>
      <button class="rail-btn" aria-label="Invoices">
        <svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v5h5M9 13h6M9 17h6"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2"/></svg>
      </button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operations</p>
          <h1>Monthly Close</h1>
        </div>
        <div class="top-actions">
          <select id="monthSelect" class="month-select" aria-label="Close month">
            <option value="2026-04">April 2026</option>
            <option value="2026-03">March 2026</option>
            <option value="2026-02">February 2026</option>
          </select>
          <input id="searchInput" class="search" type="search" placeholder="Search client or project" />
          <button class="btn primary" id="batchButton">
            <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>
            Close ready
          </button>
        </div>
      </header>

      <section class="workspace">
        <div class="metrics" id="metrics"></div>

        <div class="strip">
          <div class="segments" aria-label="Queue filter">
            <button class="segment active" data-filter="all">All</button>
            <button class="segment" data-filter="needs_action">Needs action</button>
            <button class="segment" data-filter="statement">Statements</button>
            <button class="segment" data-filter="invoice">Invoices</button>
            <button class="segment" data-filter="fixed">Fixed evidence</button>
          </div>
          <div class="hint">Draft documents claim source work. Reopen or void to change the source ledger.</div>
        </div>

        <section class="queue" aria-label="Monthly close queue">
          <div class="queue-head">
            <span>Client / project</span>
            <span>Billing unit</span>
            <span>Work</span>
            <span>Document</span>
            <span>Status</span>
            <span style="text-align:right">Action</span>
          </div>
          <div id="queueRows"></div>
        </section>
      </section>
    </main>

    <aside class="drawer" aria-label="Document preview">
      <div class="drawer-head">
        <div class="drawer-title">
          <div>
            <p class="eyebrow" id="drawerKicker">Draft document</p>
            <h2 id="drawerTitle">Client document</h2>
          </div>
          <span class="pill draft" id="drawerStatus">Draft</span>
        </div>
        <div class="doc-actions">
          <button class="btn primary" id="issueButton">
            <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>
            Issue
          </button>
          <button class="btn" id="downloadButton">
            <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
            PDF
          </button>
          <button class="btn ghost" id="reopenButton">Reopen</button>
          <button class="btn danger" id="voidButton">Void</button>
        </div>
      </div>
      <div class="doc-scroll">
        <article class="document" id="documentPreview"></article>
        <section class="editor" aria-label="Line item editor">
          <div class="editor-head">
            <span>Presentation edits</span>
            <span id="editorHint">Draft only</span>
          </div>
          <div id="lineEditor"></div>
        </section>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast">Updated</div>

  <script>
    const money = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "EUR",
      maximumFractionDigits: 0
    });

    const rows = [
      {
        id: "tm-aurora",
        client: "Northstar Labs",
        project: "Aurora Analytics",
        initials: "NL",
        type: "T&M",
        unit: "April batch",
        period: "Apr 1 - Apr 30",
        work: "48.5h",
        documentKind: "invoice",
        status: "draft",
        action: "Review invoice",
        amountDue: 7275,
        locked: 32,
        accounted: "Selected billable entries",
        summary: ["48.5 billable hours", "32 time entries locked", "Unselected April entries remain open"],
        lines: [
          { id: "l1", desc: "Dashboard architecture and KPI model", note: "Strategy, data model, and dashboard skeleton", hours: 18, rate: 150, amount: 2700, hidden: false },
          { id: "l2", desc: "Analytics implementation", note: "Charts, filters, and export-ready views", hours: 24, rate: 150, amount: 3600, hidden: false },
          { id: "l3", desc: "QA and launch support", note: "Polish, fixes, and handoff", hours: 6.5, rate: 150, amount: 975, hidden: false }
        ]
      },
      {
        id: "retainer-zero",
        client: "Kanvas Studio",
        project: "Growth Retainer",
        initials: "KS",
        type: "Retainer",
        unit: "April month",
        period: "Apr 1 - Apr 30",
        work: "35h / 40h",
        documentKind: "statement",
        status: "draft",
        action: "Issue statement",
        amountDue: 0,
        locked: 21,
        accounted: "Within included hours",
        summary: ["40h included", "35h used", "5h remaining", "Monthly fee billed outside this tool"],
        lines: [
          { id: "l1", desc: "Landing page experiments", note: "Copy variants and conversion review", hours: 12, rate: 0, amount: 0, hidden: false },
          { id: "l2", desc: "Campaign reporting", note: "Weekly reporting and channel diagnosis", hours: 15, rate: 0, amount: 0, hidden: false },
          { id: "l3", desc: "Async advisory", note: "Small questions, notes, and follow-ups", hours: 8, rate: 0, amount: 0, hidden: false }
        ]
      },
      {
        id: "retainer-over",
        client: "Mellow Markets",
        project: "Ops Retainer",
        initials: "MM",
        type: "Retainer",
        unit: "April month",
        period: "Apr 1 - Apr 30",
        work: "47h / 40h",
        documentKind: "invoice",
        status: "draft",
        action: "Review overage",
        amountDue: 980,
        locked: 28,
        accounted: "7h over included hours",
        summary: ["40h included", "47h used", "7h overage", "Overage rate EUR 140/h"],
        lines: [
          { id: "l1", desc: "Retainer activity summary", note: "Included work, client support, and monthly delivery", hours: 40, rate: 0, amount: 0, hidden: false },
          { id: "l2", desc: "Overage", note: "7h over included monthly budget", hours: 7, rate: 140, amount: 980, hidden: false }
        ]
      },
      {
        id: "rollover-month",
        client: "Bluefield Finance",
        project: "Product Retainer",
        initials: "BF",
        type: "Rollover retainer",
        unit: "Month 2 of 3",
        period: "Apr 1 - Apr 30",
        work: "52h / 60h cycle",
        documentKind: "statement",
        status: "issued",
        action: "Closed",
        amountDue: 0,
        locked: 33,
        accounted: "Mid-cycle statement",
        summary: ["Month 2 closed", "Cycle-to-date 52h used", "No payment until cycle close"],
        lines: [
          { id: "l1", desc: "Product discovery and specs", note: "Feature definitions and stakeholder alignment", hours: 20, rate: 0, amount: 0, hidden: false },
          { id: "l2", desc: "Design partner support", note: "Feedback loops and prototype review", hours: 18, rate: 0, amount: 0, hidden: false },
          { id: "l3", desc: "Delivery support", note: "Engineering handoff and review", hours: 14, rate: 0, amount: 0, hidden: false }
        ]
      },
      {
        id: "rollover-cycle",
        client: "Bluefield Finance",
        project: "Product Retainer",
        initials: "BF",
        type: "Cycle settlement",
        unit: "3-month cycle",
        period: "Feb 1 - Apr 30",
        work: "184h / 180h",
        documentKind: "invoice",
        status: "review",
        action: "Needs review",
        amountDue: 640,
        locked: 0,
        accounted: "Cycle summarizes closed months",
        summary: ["180h cycle budget", "184h used", "4h overage", "Does not own monthly entries directly"],
        lines: [
          { id: "l1", desc: "Cycle usage summary", note: "February through April closed monthly periods", hours: 180, rate: 0, amount: 0, hidden: false },
          { id: "l2", desc: "Cycle overage", note: "4h over 3-month included budget", hours: 4, rate: 160, amount: 640, hidden: false }
        ]
      },
      {
        id: "fixed-evidence",
        client: "Brightside Health",
        project: "Portal Redesign",
        initials: "BH",
        type: "Fixed fee",
        unit: "Delivery close",
        period: "Apr 1 - Apr 30",
        work: "61h evidence",
        documentKind: "statement",
        status: "draft",
        action: "Account time",
        amountDue: 0,
        locked: 44,
        accounted: "Covered by fixed fee",
        summary: ["Fixed fee already 100% billed", "61h delivery evidence", "Entries become accounted, not hourly invoiced"],
        lines: [
          { id: "l1", desc: "Delivery evidence", note: "Design, build, QA, and rollout work covered by fixed fee", hours: 61, rate: 0, amount: 0, hidden: false }
        ]
      },
      {
        id: "fixed-invoice",
        client: "Helio Works",
        project: "Website Build",
        initials: "HW",
        type: "Fixed fee",
        unit: "Final balance",
        period: "Milestone",
        work: "42h evidence",
        documentKind: "invoice",
        status: "draft",
        action: "Bill balance",
        amountDue: 4200,
        locked: 19,
        accounted: "Final fixed balance",
        summary: ["EUR 12,000 fixed price", "EUR 7,800 already issued", "EUR 4,200 remaining"],
        lines: [
          { id: "l1", desc: "Final fixed-fee balance", note: "Website build completion milestone", hours: 1, rate: 4200, amount: 4200, hidden: false },
          { id: "l2", desc: "Delivery evidence", note: "42h supporting time, shown for context", hours: 42, rate: 0, amount: 0, hidden: false }
        ]
      }
    ];

    const state = {
      selectedId: rows[0].id,
      filter: "all",
      search: "",
      month: "2026-04",
      lineDrafts: structuredClone(Object.fromEntries(rows.map((row) => [row.id, row.lines])))
    };

    const queueRows = document.getElementById("queueRows");
    const metrics = document.getElementById("metrics");
    const documentPreview = document.getElementById("documentPreview");
    const lineEditor = document.getElementById("lineEditor");
    const drawerTitle = document.getElementById("drawerTitle");
    const drawerKicker = document.getElementById("drawerKicker");
    const drawerStatus = document.getElementById("drawerStatus");
    const issueButton = document.getElementById("issueButton");
    const reopenButton = document.getElementById("reopenButton");
    const voidButton = document.getElementById("voidButton");
    const downloadButton = document.getElementById("downloadButton");
    const toast = document.getElementById("toast");

    function selectedRow() {
      return rows.find((row) => row.id === state.selectedId) || rows[0];
    }

    function visibleRows() {
      const term = state.search.trim().toLowerCase();
      return rows.filter((row) => {
        if (state.filter === "needs_action" && (row.status === "issued" || row.status === "closed")) return false;
        if (state.filter === "statement" && row.documentKind !== "statement") return false;
        if (state.filter === "invoice" && row.documentKind !== "invoice") return false;
        if (state.filter === "fixed" && row.type !== "Fixed fee") return false;
        if (!term) return true;
        return [row.client, row.project, row.type, row.unit].join(" ").toLowerCase().includes(term);
      });
    }

    function documentNumber(row) {
      const index = rows.findIndex((item) => item.id === row.id) + 41;
      return row.documentKind === "invoice" ? `INV-${String(index).padStart(3, "0")}` : `STM-${String(index).padStart(3, "0")}`;
    }

    function statusClass(status) {
      if (status === "issued" || status === "closed") return "issued";
      if (status === "review") return "review";
      return "draft";
    }

    function renderMetrics() {
      const active = rows.filter((row) => row.status !== "issued" && row.status !== "closed");
      const statementCount = rows.filter((row) => row.documentKind === "statement").length;
      const invoiceTotal = rows.reduce((sum, row) => sum + (row.documentKind === "invoice" ? row.amountDue : 0), 0);
      const lockedEntries = rows.reduce((sum, row) => sum + row.locked, 0);

      const items = [
        ["Needs close", active.length, "Draft or review documents in this month"],
        ["Invoice due", money.format(invoiceTotal), "Only invoice-kind documents hit the ledger"],
        ["Statements", statementCount, "Zero-due documents, same layout"],
        ["Locked entries", lockedEntries, "Claimed by draft or issued periods"]
      ];

      metrics.innerHTML = items.map(([label, value, note]) => `
        <div class="metric">
          <label>${label}</label>
          <strong>${value}</strong>
          <span>${note}</span>
        </div>
      `).join("");
    }

    function renderQueue() {
      const list = visibleRows();
      queueRows.innerHTML = list.map((row) => `
        <button class="queue-row ${row.id === state.selectedId ? "selected" : ""}" data-row-id="${row.id}">
          <span class="project-cell">
            <span class="avatar">${row.initials}</span>
            <span class="titleline">
              <strong>${row.client}</strong>
              <span>${row.project}</span>
            </span>
          </span>
          <span>
            <span class="cell-main">${row.unit}</span>
            <span class="cell-sub">${row.type}</span>
          </span>
          <span>
            <span class="cell-main">${row.work}</span>
            <span class="cell-sub">${row.locked ? `${row.locked} entries locked` : "summary only"}</span>
          </span>
          <span>
            <span class="pill ${row.documentKind}">${row.documentKind}</span>
            <span class="cell-sub">${row.amountDue ? money.format(row.amountDue) : "zero due"}</span>
          </span>
          <span>
            <span class="pill ${statusClass(row.status)}">${row.status}</span>
            <span class="cell-sub">${row.accounted}</span>
          </span>
          <span class="action-text">${row.action}</span>
        </button>
      `).join("");

      queueRows.querySelectorAll("[data-row-id]").forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedId = button.dataset.rowId;
          updateAll();
        });
      });
    }

    function renderDocument() {
      const row = selectedRow();
      const lines = state.lineDrafts[row.id];
      const visibleLines = lines.filter((line) => !line.hidden);
      const subtotal = visibleLines.reduce((sum, line) => sum + line.amount, 0);
      const amountDue = row.documentKind === "invoice" ? subtotal : 0;
      const kindLabel = row.documentKind === "invoice" ? "Invoice" : "Statement";
      const paymentLabel = row.documentKind === "invoice" ? "Amount due" : "No payment due";
      const statusLabel = row.status === "issued" ? "Issued" : row.status === "review" ? "Needs review" : "Draft";

      drawerTitle.textContent = `${kindLabel} - ${row.project}`;
      drawerKicker.textContent = `${row.client} / ${row.period}`;
      drawerStatus.textContent = statusLabel;
      drawerStatus.className = `pill ${statusClass(row.status)}`;

      issueButton.disabled = row.status === "issued";
      reopenButton.disabled = row.status === "draft";

      documentPreview.innerHTML = `
        <div class="doc-top">
          <div>
            <p class="doc-kicker">${kindLabel}</p>
            <h3 class="doc-title">${row.unit}</h3>
          </div>
          <div class="doc-meta">
            <div><span>No.</span><strong>${documentNumber(row)}</strong></div>
            <div><span>Issue date</span><strong>May 1, 2026</strong></div>
            ${row.documentKind === "invoice" ? `<div><span>Due date</span><strong>May 31, 2026</strong></div>` : ""}
            <div><span>Status</span><strong>${statusLabel}</strong></div>
          </div>
        </div>

        <div class="parties">
          <div class="party">
            <label>From</label>
            <strong>Agency Flow Studio</strong>
            <p>Budapest, Hungary<br>billing@agencyflow.test</p>
          </div>
          <div class="party">
            <label>To</label>
            <strong>${row.client}</strong>
            <p>${row.project}<br>${row.period}</p>
          </div>
        </div>

        <div class="summary-band">
          ${row.summary.slice(0, 3).map((item, index) => `
            <div class="summary-item">
              <label>${["Period result", "Usage", "Close rule"][index]}</label>
              <strong>${item}</strong>
            </div>
          `).join("")}
        </div>

        <table class="doc-table">
          <thead>
            <tr>
              <th>Description</th>
              <th class="num">Qty</th>
              ${row.documentKind === "invoice" ? `<th class="num">Rate</th><th class="num">Amount</th>` : `<th class="num">Amount</th>`}
            </tr>
          </thead>
          <tbody>
            ${lines.map((line) => `
              <tr class="${line.hidden ? "hidden-line" : ""}">
                <td>
                  <span class="line-desc">${line.desc}</span>
                  <span class="line-note">${line.note}</span>
                </td>
                <td class="num">${line.hours}h</td>
                ${row.documentKind === "invoice" ? `<td class="num">${line.rate ? money.format(line.rate) : "-"}</td>` : ""}
                <td class="num">${row.documentKind === "invoice" ? money.format(line.amount) : "-"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>

        <div class="doc-total">
          ${row.documentKind === "invoice" ? `
            <div class="total-row"><span>Subtotal</span><strong>${money.format(subtotal)}</strong></div>
            <div class="total-row amount-due"><span>${paymentLabel}</span><strong>${money.format(amountDue)}</strong></div>
          ` : `
            <div class="total-row amount-due"><span>${paymentLabel}</span><strong>${money.format(0)}</strong></div>
          `}
        </div>

        <div class="doc-note">
          ${row.documentKind === "invoice"
            ? "This document requests payment for the amount due. It appears in the invoice ledger and payment follow-up views once issued."
            : "This document closes and communicates the period, but it is not a payment request and does not appear in the invoice ledger."}
        </div>
      `;
    }

    function renderEditor() {
      const row = selectedRow();
      const lines = state.lineDrafts[row.id];
      const disabled = row.status === "issued" ? "disabled" : "";
      document.getElementById("editorHint").textContent = row.status === "issued" ? "Locked after issue" : "Draft only";

      lineEditor.innerHTML = lines.map((line, index) => `
        <div class="editor-row">
          <input value="${escapeHtml(line.desc)}" data-line-index="${index}" data-field="desc" ${disabled} aria-label="Line description" />
          <input value="${line.hours}" data-line-index="${index}" data-field="hours" ${disabled} aria-label="Line hours" />
          <span class="mini-actions">
            <button class="icon-btn" data-round-index="${index}" ${disabled} title="Round hours">R</button>
            <button class="icon-btn" data-hide-index="${index}" ${disabled} title="Hide line">${line.hidden ? "S" : "H"}</button>
          </span>
        </div>
      `).join("");

      lineEditor.querySelectorAll("input").forEach((input) => {
        input.addEventListener("input", () => {
          const line = lines[Number(input.dataset.lineIndex)];
          if (input.dataset.field === "desc") {
            line.desc = input.value;
          } else {
            const hours = Number(input.value);
            if (!Number.isNaN(hours)) {
              line.hours = hours;
              line.amount = Math.round(hours * line.rate);
            }
          }
          renderDocument();
        });
      });

      lineEditor.querySelectorAll("[data-round-index]").forEach((button) => {
        button.addEventListener("click", () => {
          const line = lines[Number(button.dataset.roundIndex)];
          line.hours = Math.ceil(line.hours);
          line.amount = Math.round(line.hours * line.rate);
          updateAll();
          showToast("Line rounded for client-facing display");
        });
      });

      lineEditor.querySelectorAll("[data-hide-index]").forEach((button) => {
        button.addEventListener("click", () => {
          const line = lines[Number(button.dataset.hideIndex)];
          line.hidden = !line.hidden;
          updateAll();
          showToast(line.hidden ? "Line hidden from client document" : "Line restored");
        });
      });
    }

    function updateAll() {
      renderMetrics();
      renderQueue();
      renderDocument();
      renderEditor();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    document.querySelectorAll(".segment").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".segment").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        state.filter = button.dataset.filter;
        updateAll();
      });
    });

    document.getElementById("searchInput").addEventListener("input", (event) => {
      state.search = event.target.value;
      updateAll();
    });

    document.getElementById("monthSelect").addEventListener("change", (event) => {
      state.month = event.target.value;
      showToast(`Viewing ${event.target.options[event.target.selectedIndex].text}`);
    });

    issueButton.addEventListener("click", () => {
      const row = selectedRow();
      row.status = "issued";
      row.action = "Closed";
      updateAll();
      showToast(`${row.documentKind === "invoice" ? "Invoice" : "Statement"} issued and period closed`);
    });

    reopenButton.addEventListener("click", () => {
      const row = selectedRow();
      row.status = "draft";
      row.action = row.documentKind === "invoice" ? "Review invoice" : "Issue statement";
      updateAll();
      showToast("Period reopened with audit reason");
    });

    voidButton.addEventListener("click", () => {
      const row = selectedRow();
      row.status = "review";
      row.action = "Needs review";
      updateAll();
      showToast("Document voided in prototype state");
    });

    downloadButton.addEventListener("click", () => {
      showToast("PDF export would use browser print in v1");
    });

    document.getElementById("batchButton").addEventListener("click", () => {
      rows.forEach((row) => {
        if (row.status === "draft") {
          row.status = "issued";
          row.action = "Closed";
        }
      });
      updateAll();
      showToast("Draft close rows issued in prototype");
    });

    updateAll();
  </script>
</body>
</html>
