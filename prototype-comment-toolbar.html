<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comment Composer — Bottom Toolbar Prototype</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #f5f5f5;
    --bg-surface: #ffffff;
    --bg-elevated: #fafafa;
    --bg-muted: #f4f4f5;
    --bg-hover: #f0f0f2;
    --border: #e4e4e7;
    --border-subtle: #e8e8eb;
    --border-focus: #3b82f6;
    --text: #09090b;
    --text-muted: #71717a;
    --text-dimmed: #a1a1aa;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --ring: rgba(59, 130, 246, 0.2);
    --active-bg: #e4e4e7;
    --active-text: #18181b;
    --radius: 8px;
  }

  body {
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  /* ── Context wrapper (simulates modal sidebar) ── */
  .context {
    width: 420px;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .context-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dimmed);
  }

  /* ── Composer container ── */
  .composer {
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    background: var(--bg-surface);
    transition: border-color 180ms ease, box-shadow 180ms ease;
    overflow: hidden;
  }

  .composer:focus-within {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--ring);
  }

  /* ── Reply banner ── */
  .reply-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    background: var(--bg-muted);
    border-bottom: 1px solid var(--border-subtle);
    font-size: 12px;
    color: var(--text-muted);
  }

  .reply-banner .close-reply {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 120ms;
  }

  .reply-banner .close-reply:hover {
    background: var(--bg-hover);
  }

  /* ── Editable area ── */
  .editor-area {
    min-height: 80px;
    max-height: 240px;
    overflow-y: auto;
    padding: 10px 14px;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text);
    outline: none;
  }

  .editor-area:empty::before {
    content: attr(data-placeholder);
    color: var(--text-dimmed);
    pointer-events: none;
  }

  /* ── Pending attachments ── */
  .attachments {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 12px 8px;
  }

  .attachment-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px 3px 6px;
    border-radius: 6px;
    background: var(--bg-muted);
    border: 1px solid var(--border-subtle);
    font-size: 11px;
    color: var(--text-muted);
  }

  .attachment-chip .chip-icon {
    width: 14px;
    height: 14px;
    opacity: 0.5;
  }

  .attachment-chip .remove-chip {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    margin-left: 2px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-dimmed);
    cursor: pointer;
    transition: color 100ms;
  }

  .attachment-chip .remove-chip:hover {
    color: var(--text);
  }

  /* ── Bottom toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    padding: 3px 5px;
    border-top: 1px solid var(--border-subtle);
    background: var(--bg-elevated);
    gap: 1px;
  }

  .toolbar-spacer {
    flex: 1;
  }

  .sep {
    width: 1px;
    height: 16px;
    background: var(--border);
    margin: 0 4px;
    flex-shrink: 0;
  }

  /* ── Toolbar button ── */
  .tb {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--text-dimmed);
    cursor: pointer;
    transition: background 100ms ease, color 100ms ease;
    flex-shrink: 0;
    position: relative;
  }

  .tb:hover {
    background: var(--bg-hover);
    color: var(--text-muted);
  }

  .tb.active {
    background: var(--active-bg);
    color: var(--active-text);
  }

  .tb svg {
    width: 15px;
    height: 15px;
    pointer-events: none;
  }

  /* ── Send button ── */
  .send-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: background 140ms ease, transform 80ms ease, opacity 140ms;
    flex-shrink: 0;
  }

  .send-btn.empty {
    background: transparent;
    color: var(--text-dimmed);
    opacity: 0.35;
    cursor: default;
  }

  .send-btn.ready {
    background: var(--primary);
    color: #fff;
    opacity: 1;
  }

  .send-btn.ready:hover {
    background: var(--primary-hover);
  }

  .send-btn.ready:active {
    transform: scale(0.92);
  }

  .send-btn svg {
    width: 15px;
    height: 15px;
    pointer-events: none;
  }

  /* ── Tooltip ── */
  .tb[data-tip]::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--bg-deep);
    color: var(--text-muted);
    font-size: 11px;
    white-space: nowrap;
    padding: 3px 7px;
    border-radius: 5px;
    border: 1px solid var(--border);
    pointer-events: none;
    opacity: 0;
    transition: opacity 120ms, transform 120ms;
    z-index: 10;
  }

  .tb[data-tip]:hover::after {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Comparison: current layout ── */
  .comparison {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    width: 900px;
  }

  .variant-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .variant-label .badge {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .badge-current {
    background: var(--bg-muted);
    color: var(--text-dimmed);
  }

  .badge-new {
    background: rgba(59, 130, 246, 0.15);
    color: var(--primary);
  }

  /* ── Current (top toolbar) variant ── */
  .composer-current .top-toolbar {
    display: flex;
    align-items: center;
    padding: 3px 5px;
    border-bottom: 1px solid var(--border-subtle);
    background: var(--bg-elevated);
    gap: 1px;
  }

  .composer-current .bottom-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 5px;
    border-top: 1px solid var(--border-subtle);
  }

  .composer-current .bottom-actions .action-group {
    display: flex;
    align-items: center;
    gap: 1px;
  }

  /* ── Scrollbar ── */
  .editor-area::-webkit-scrollbar {
    width: 4px;
  }
  .editor-area::-webkit-scrollbar-track {
    background: transparent;
  }
  .editor-area::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
  }

  /* ── Keyboard hint ── */
  .kbd-hint {
    font-size: 10.5px;
    color: var(--text-dimmed);
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  kbd {
    font-family: inherit;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--bg-muted);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="comparison">
  <!-- ─── CURRENT: Top toolbar layout ─── -->
  <div>
    <div class="variant-label">
      <span class="badge badge-current">Current</span>
      Toolbar top — Slack style
    </div>
    <div class="composer composer-current" style="width: 420px;">
      <!-- Top toolbar -->
      <div class="top-toolbar">
        <button class="tb" data-toggle data-tip="Bold"><i data-lucide="bold"></i></button>
        <button class="tb" data-toggle data-tip="Italic"><i data-lucide="italic"></i></button>
        <button class="tb" data-toggle data-tip="Strikethrough"><i data-lucide="strikethrough"></i></button>
        <button class="tb" data-toggle data-tip="Link"><i data-lucide="link"></i></button>
        <div class="sep"></div>
        <button class="tb" data-toggle data-tip="Bullet list"><i data-lucide="list"></i></button>
        <button class="tb" data-toggle data-tip="Ordered list"><i data-lucide="list-ordered"></i></button>
        <button class="tb" data-toggle data-tip="Checklist"><i data-lucide="list-checks"></i></button>
        <div class="sep"></div>
        <button class="tb" data-toggle data-tip="Code"><i data-lucide="code"></i></button>
      </div>

      <div class="editor-area" contenteditable="true" data-placeholder="Write a comment..." oninput="updateSend(this)"></div>

      <!-- Bottom actions only -->
      <div class="bottom-actions">
        <div class="action-group">
          <button class="tb" data-tip="Mention"><i data-lucide="at-sign"></i></button>
          <div class="sep"></div>
          <button class="tb" data-tip="Attach"><i data-lucide="paperclip"></i></button>
        </div>
        <button class="send-btn empty" id="send-current"><i data-lucide="send-horizontal"></i></button>
      </div>
    </div>
  </div>

  <!-- ─── NEW: Bottom toolbar layout (Gmail style) ─── -->
  <div>
    <div class="variant-label">
      <span class="badge badge-new">Proposed</span>
      Toolbar bottom — Gmail style
    </div>
    <div class="composer" style="width: 420px;">
      <!-- Reply banner example -->
      <div class="reply-banner" id="reply-banner">
        <span>↩ Replying to Sarah M.</span>
        <button class="close-reply" onclick="this.parentElement.style.display='none'">
          <i data-lucide="x" style="width:12px;height:12px"></i>
        </button>
      </div>

      <!-- Editor area — clean, no toolbar above -->
      <div class="editor-area" contenteditable="true" data-placeholder="Write a comment..." oninput="updateSend(this)" style="min-height: 100px;"></div>

      <!-- Attachments preview -->
      <div class="attachments" id="attachments-demo">
        <div class="attachment-chip">
          <i data-lucide="file-text" class="chip-icon"></i>
          <span>brief-v2.pdf</span>
          <button class="remove-chip" onclick="this.parentElement.remove()"><i data-lucide="x" style="width:10px;height:10px"></i></button>
        </div>
      </div>

      <!-- Single bottom toolbar: formatting + actions + send -->
      <div class="toolbar">
        <button class="tb" data-toggle data-tip="Bold"><i data-lucide="bold"></i></button>
        <button class="tb" data-toggle data-tip="Italic"><i data-lucide="italic"></i></button>
        <button class="tb" data-toggle data-tip="Strikethrough"><i data-lucide="strikethrough"></i></button>
        <button class="tb" data-toggle data-tip="Link"><i data-lucide="link"></i></button>
        <div class="sep"></div>
        <button class="tb" data-toggle data-tip="Bullet list"><i data-lucide="list"></i></button>
        <button class="tb" data-toggle data-tip="Ordered list"><i data-lucide="list-ordered"></i></button>
        <button class="tb" data-toggle data-tip="Checklist"><i data-lucide="list-checks"></i></button>
        <div class="sep"></div>
        <button class="tb" data-toggle data-tip="Code"><i data-lucide="code"></i></button>
        <div class="sep"></div>
        <button class="tb" data-tip="Mention"><i data-lucide="at-sign"></i></button>
        <button class="tb" data-tip="Attach"><i data-lucide="paperclip"></i></button>

        <div class="toolbar-spacer"></div>

        <button class="send-btn empty" id="send-new"><i data-lucide="send-horizontal"></i></button>
      </div>

      <div class="kbd-hint">
        <kbd>Enter</kbd> to send · <kbd>Shift + Enter</kbd> new line
      </div>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();

  // Toggle active state on formatting buttons
  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
    });
  });

  // Update send button state based on content
  function updateSend(el) {
    const hasContent = el.textContent.trim().length > 0;
    // Find the closest composer's send button
    const composer = el.closest('.composer');
    const sendBtn = composer.querySelector('.send-btn');
    if (sendBtn) {
      sendBtn.className = hasContent ? 'send-btn ready' : 'send-btn empty';
    }
  }
</script>
</body>
</html>
