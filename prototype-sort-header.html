<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sort — Prototype</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --fg: #1a1625;
    --muted-fg: #807d8b;
    --muted-fg-40: rgba(128,125,139,0.4);
    --muted-fg-55: rgba(128,125,139,0.55);
    --border: #e5e5e8;
    --border-soft: rgba(229,229,232,0.5);
    --muted: #f7f7f9;
    --hover: rgba(0,0,0,0.03);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Table container ──────────────────────────── */
  .table-wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 0 80px;
    overflow-x: auto;
  }

  /* ─── Grid ─────────────────────────────────────── */
  .g {
    display: grid;
    grid-template-columns: 36px 1fr 56px 116px 108px 176px 80px 96px 76px 36px;
    gap: 0 16px;
    padding: 0 12px;
    min-width: 1200px;
  }
  .g > * { min-width: 0; overflow: hidden; }

  /* ─── Header row ───────────────────────────────── */
  .hdr {
    align-items: center;
    border-bottom: 1px solid var(--border);
    height: 40px;
  }

  .hdr-cell {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted-fg);
    white-space: nowrap;
    user-select: none;
  }
  .hdr-cell svg.ic { width: 12px; height: 12px; flex-shrink: 0; opacity: 0.5; }

  /* Non-sortable headers are dimmer */
  .hdr-cell.static { opacity: 0.65; }

  /* ─── Sort trigger button ──────────────────────── */
  .st {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted-fg);
    background: none;
    border: none;
    cursor: pointer;
    border-radius: 5px;
    padding: 4px 6px;
    margin: -4px -6px;
    transition: background 100ms, color 100ms;
    white-space: nowrap;
    position: relative;
  }
  .st svg.ic { width: 12px; height: 12px; flex-shrink: 0; opacity: 0.5; transition: opacity 100ms; }

  .st:hover { background: var(--hover); color: var(--fg); }
  .st:hover svg.ic { opacity: 0.7; }

  /* Chevron indicator */
  .chev {
    width: 14px; height: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 100ms;
  }
  .chev svg { width: 12px; height: 12px; transition: transform 150ms ease; }
  .st:hover .chev { opacity: 0.25; }

  /* Active sort */
  .st.on { color: var(--fg); }
  .st.on svg.ic { opacity: 0.75; }
  .st.on .chev { opacity: 0.5; }
  .st.on:hover .chev { opacity: 0.7; }
  .st.on.desc .chev svg { transform: rotate(180deg); }

  /* ─── Sort dropdown ────────────────────────────── */
  .dd {
    position: absolute;
    top: calc(100% + 6px);
    left: -4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(0,0,0,0.03);
    min-width: 185px;
    padding: 4px;
    z-index: 999;
    opacity: 0;
    transform: translateY(-3px);
    pointer-events: none;
    transition: opacity 100ms ease, transform 100ms ease;
  }
  .dd.open { opacity: 1; transform: translateY(0); pointer-events: auto; }

  .dd-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 32px;
    padding: 0 8px 0 10px;
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    background: none;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background 60ms;
    text-align: left;
  }
  .dd-item:hover { background: var(--muted); }
  .dd-item svg.di { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.4; }
  .dd-item .ck { margin-left: auto; width: 14px; height: 14px; flex-shrink: 0; }
  .dd-item .ck svg { width: 14px; height: 14px; opacity: 0; }
  .dd-item.sel { font-weight: 500; }
  .dd-item.sel .ck svg { opacity: 0.55; }
  .dd-item.sel svg.di { opacity: 0.65; }

  .dd-sep { height: 1px; background: var(--border-soft); margin: 3px 6px; }
  .dd-item.rst { font-size: 12px; color: var(--muted-fg); height: 30px; }

  /* ─── Task rows ────────────────────────────────── */
  .row {
    align-items: center;
    border-bottom: 1px solid var(--border-soft);
    padding-top: 10px; padding-bottom: 10px;
    transition: background 80ms;
  }
  .row:hover { background: var(--hover); }

  .tn { font-size: 14px; color: var(--fg); }
  .ts { font-size: 11px; color: var(--muted-fg-55); margin-top: 1px; }
  .c { font-size: 12px; color: var(--muted-fg); }
  .ce { font-size: 11px; color: var(--muted-fg-40); }

  /* Pills */
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; }
  .pill .d { width: 6px; height: 6px; border-radius: 50%; }
  .p-a { background: rgba(245,166,35,0.1); color: #b27a00; }
  .p-a .d { background: #f5a623; }
  .p-g { background: rgba(128,125,139,0.08); color: #807d8b; }
  .p-g .d { background: #9e9ba5; }

  .cat { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted-fg); }
  .cat .d { width: 5px; height: 5px; border-radius: 50%; }

  /* Add row */
  .addrow { align-items: center; border-bottom: 1px solid var(--border-soft); padding: 10px 0; }
  .addrow svg { width: 14px; height: 14px; color: var(--muted-fg-40); }

  /* Sort badge */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--muted-fg);
    padding: 3px 8px 3px 6px;
    background: var(--muted);
    border-radius: 5px;
    margin: 12px 12px 8px;
  }
  .badge svg { width: 13px; height: 13px; opacity: 0.45; }
  .badge strong { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>

<div class="table-wrap">
  <!-- Current sort indicator -->
  <div class="badge" id="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
    <span id="badge-txt"><strong>Created</strong> &darr;</span>
  </div>

  <!-- Header -->
  <div class="g hdr">
    <div></div>

    <div class="hdr-cell">
      <button class="st" data-f="title" onclick="open(this,event)">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Task</span>
        <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></span>
        <div class="dd">
          <button class="dd-item" onclick="pick('title','asc',event)"><svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>Ascending (A&rarr;Z)<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
          <button class="dd-item" onclick="pick('title','desc',event)"><svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>Descending (Z&rarr;A)<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
          <div class="dd-sep"></div>
          <button class="dd-item rst" onclick="pick('createdAt','desc',event)"><svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Reset to default<span class="ck"></span></button>
        </div>
      </button>
    </div>

    <div class="hdr-cell static">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>Comm.
    </div>

    <div class="hdr-cell">
      <button class="st" data-f="status" onclick="open(this,event)">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-dasharray="4 4"/></svg>
        <span>Status</span>
        <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></span>
        <div class="dd">
          <button class="dd-item" onclick="pick('status','asc',event)"><svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>Ascending<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
          <button class="dd-item" onclick="pick('status','desc',event)"><svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>Descending<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
          <div class="dd-sep"></div>
          <button class="dd-item rst" onclick="pick('createdAt','desc',event)"><svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Reset to default<span class="ck"></span></button>
        </div>
      </button>
    </div>

    <div class="hdr-cell">
      <button class="st" data-f="category" onclick="open(this,event)">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg>
        <span>Category</span>
        <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></span>
        <div class="dd">
          <button class="dd-item" onclick="pick('category','asc',event)"><svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>Ascending (A&rarr;Z)<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
          <button class="dd-item" onclick="pick('category','desc',event)"><svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>Descending (Z&rarr;A)<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
          <div class="dd-sep"></div>
          <button class="dd-item rst" onclick="pick('createdAt','desc',event)"><svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Reset to default<span class="ck"></span></button>
        </div>
      </button>
    </div>

    <div class="hdr-cell static">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Client / Project
    </div>

    <div class="hdr-cell static">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Assignee
    </div>

    <div class="hdr-cell">
      <button class="st" data-f="dueDate" onclick="open(this,event)">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
        <span>Due date</span>
        <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></span>
        <div class="dd">
          <button class="dd-item" onclick="pick('dueDate','asc',event)"><svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>Earliest first<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
          <button class="dd-item" onclick="pick('dueDate','desc',event)"><svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>Latest first<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
          <div class="dd-sep"></div>
          <button class="dd-item rst" onclick="pick('createdAt','desc',event)"><svg class="di" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Reset to default<span class="ck"></span></button>
        </div>
      </button>
    </div>

    <div class="hdr-cell static">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Time
    </div>

    <div></div>
  </div>

  <!-- Rows -->
  <div id="rows"></div>

  <!-- Add row -->
  <div class="g addrow">
    <div></div>
    <div style="display:flex;align-items:center;gap:6px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      <span style="font-size:14px;color:var(--muted-fg-40)">Task name...</span>
    </div>
    <div></div>
    <div class="ce">Status</div>
    <div class="ce">Category</div>
    <div class="ce">Project</div>
    <div class="ce">Assign</div>
    <div class="ce">Due</div>
    <div></div>
    <div></div>
  </div>
</div>

<script>
const T=[
  {id:1,t:"ez meg egy másik",s:"Adam created this task · 2h ago",st:"Today",sp:"p-a",so:2,cat:null,cc:null,cl:null,pr:null,as:null,due:null,tm:null,cr:6},
  {id:2,t:"task",s:"Adam created this task · 2h ago",st:"Today",sp:"p-a",so:2,cat:null,cc:null,cl:null,pr:null,as:null,due:null,tm:null,cr:5},
  {id:3,t:"Fixed 06",s:"Adam updated description · 22h ago",st:"Today",sp:"p-a",so:2,cat:"Copywriting",cc:"#8b5cf6",cl:"Konverted Web Agency Kft",pr:"Monthly Support",as:"Oslop",due:"2026-03-30",tm:null,cr:4},
  {id:4,t:"Fixed 03",s:"Adam updated · 2d ago",st:"Today",sp:"p-a",so:2,cat:"Design",cc:"#3b82f6",cl:"Konverted Web Agency Kft",pr:"Fixed project",as:null,due:null,tm:"03:00",cr:3},
  {id:5,t:"Fixed 02",s:"Adam updated description · 3h ago",st:"Today",sp:"p-a",so:2,cat:"Development",cc:"#22c55e",cl:"Konverted Web Agency Kft",pr:"Fixed project",as:"Adam",due:"2026-04-05",tm:"01:00",cr:2},
  {id:6,t:"Fixed 01",s:"Adam assigned Adam Toth · 1d ago",st:"Today",sp:"p-a",so:2,cat:"Development",cc:"#22c55e",cl:"Konverted Web Agency Kft",pr:"Fixed project",as:"Adam",due:"2026-03-28",tm:"01:00",cr:1},
  {id:7,t:"Ez egy teszt task",s:"Adam commented · 5h ago",st:"Inbox",sp:"p-g",so:1,cat:"Design",cc:"#3b82f6",cl:"Konverted Web Agency Kft",pr:"Monthly Support",as:"Adam",due:"2026-04-12",tm:"03:15",cr:0},
];

let cur={f:"createdAt",d:"desc"};

function srt(f,d){
  const m=d==="asc"?1:-1;
  return[...T].sort((a,b)=>{
    let c=0;
    switch(f){
      case"title":c=a.t.localeCompare(b.t,"hu")*m;break;
      case"status":c=((a.so-b.so)||a.st.localeCompare(b.st,"hu"))*m;break;
      case"category":{const x=a.cat||"\uffff",y=b.cat||"\uffff";if(x==="\uffff"&&y!=="\uffff")return 1;if(y==="\uffff"&&x!=="\uffff")return-1;c=x.localeCompare(y,"hu")*m;break;}
      case"dueDate":{const x=a.due||"\uffff",y=b.due||"\uffff";if(x==="\uffff"&&y!=="\uffff")return 1;if(y==="\uffff"&&x!=="\uffff")return-1;c=x.localeCompare(y)*m;break;}
      case"createdAt":c=(a.cr-b.cr)*m;break;
    }
    return c||(b.cr-a.cr);
  });
}

function fmtD(d){if(!d)return null;const x=new Date(d+"T00:00:00");return x.toLocaleDateString("en-US",{month:"short",day:"numeric"});}

function render(list){
  document.getElementById("rows").innerHTML=list.map(t=>`
    <div class="g row">
      <div></div>
      <div><div class="tn">${t.t}</div><div class="ts">${t.s}</div></div>
      <div></div>
      <div><span class="pill ${t.sp}"><span class="d"></span>${t.st}</span></div>
      <div>${t.cat?`<span class="cat"><span class="d" style="background:${t.cc}"></span>${t.cat}</span>`:""}</div>
      <div>${t.cl?`<div style="font-size:12px;font-weight:500">${t.cl}</div><div style="font-size:11px;color:var(--muted-fg-40)">${t.pr}</div>`:""}</div>
      <div class="${t.as?"c":"ce"}">${t.as||"Assign"}</div>
      <div class="${t.due?"c":"ce"}">${fmtD(t.due)||"Due"}</div>
      <div class="c">${t.tm||""}</div>
      <div></div>
    </div>`).join("");
}

function ui(){
  document.querySelectorAll(".st").forEach(b=>{b.classList.remove("on","desc");});
  document.querySelectorAll(".dd-item").forEach(i=>i.classList.remove("sel"));
  const b=document.querySelector(`.st[data-f="${cur.f}"]`);
  if(b){
    b.classList.add("on");
    if(cur.d==="desc")b.classList.add("desc");
    const items=b.querySelectorAll(".dd-item:not(.rst)");
    items.forEach(i=>{if((cur.d==="asc"&&i.textContent.includes("Asc"))||(cur.d==="asc"&&i.textContent.includes("Earliest"))||(cur.d==="desc"&&i.textContent.includes("Desc"))||(cur.d==="desc"&&i.textContent.includes("Latest")))i.classList.add("sel");});
  }
  const labels={title:"Task",status:"Status",category:"Category",dueDate:"Due date",createdAt:"Created"};
  document.getElementById("badge-txt").innerHTML=`<strong>${labels[cur.f]}</strong> ${cur.d==="asc"?"&uarr;":"&darr;"}`;
}

function closeAll(){document.querySelectorAll(".dd").forEach(d=>d.classList.remove("open"));}

// Use window.open_ to avoid conflict with window.open
window.openMenu=function(btn,e){e.stopPropagation();closeAll();btn.querySelector(".dd").classList.add("open");};
// Fix: rename from 'open' to avoid window.open conflict
document.querySelectorAll(".st").forEach(b=>{
  b.setAttribute("onclick","openMenu(this,event)");
});

window.pick=function(f,d,e){e.stopPropagation();cur={f,d};closeAll();ui();render(srt(f,d));};

document.addEventListener("click",closeAll);

ui();render(srt("createdAt","desc"));
</script>

</body>
</html>
